name: Supabase migration checks

on:
  push:
    branches: [admin-dashboard-foundation]
    paths:
      - "supabase/migrations/**"
      - "scripts/check_supabase_migrations.py"
      - ".github/workflows/supabase-migration-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/check_supabase_migrations.py"
      - ".github/workflows/supabase-migration-check.yml"

permissions:
  contents: read

jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse migrations and verify security contracts
        run: python scripts/check_supabase_migrations.py
